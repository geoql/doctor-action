name: 'Doctor — Vue / Nuxt Code Audit'
description: 'Audit Vue / Nuxt code with @geoql doctor — AI-slop, reactivity traps, and perf anti-patterns. Emits a quality score, structured findings, and a SARIF report for Code Scanning. v2 push mode streams privacy-stripped findings to the-doctor.report.'
author: 'geoql'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  framework:
    description: 'Which doctor to run: vue | nuxt.'
    required: false
    default: 'vue'
  preset:
    description: 'Base rule preset: minimal | recommended | strict | all.'
    required: false
    default: 'recommended'
  threshold:
    description: 'Minimum passing score (0-100). The job fails when the score is below this value.'
    required: false
    default: '0'
  fail-on:
    description: 'Exit non-zero on this severity or worse: error | warn | none.'
    required: false
    default: 'error'
  version:
    description: "@geoql/<framework>-doctor version or range to run. The default 'latest' uses the project's own installed doctor (via its package manager) when present, else the range declared in package.json, else the latest published version. Any other value always overrides."
    required: false
    default: 'latest'
  diff:
    description: "Only report findings in changed files. On pull requests the changed set is the PR head vs its base; elsewhere it is changes vs HEAD. Set to 'true' to enable."
    required: false
    default: 'false'
  pr-comment:
    description: "Emit a Markdown PR comment. Set to 'true' to enable."
    required: false
    default: 'false'
  working-directory:
    description: 'Directory to run the audit in (the project root).'
    required: false
    default: '.'
  api-key:
    description: 'the-doctor.report API key (doc_…). When set, the score and findings are pushed to your dashboard. Pass via secrets, never inline.'
    required: false
    default: ''
  project:
    description: 'Project slug for the-doctor.report dashboard. Defaults to the GitHub owner/repo.'
    required: false
    default: ${{ github.repository }}
  push-mode:
    description: 'How to push results to the-doctor.report: "full" (v2, CLI streams privacy-stripped findings in one call) or "score" (legacy, action posts only the score via curl).'
    required: false
    default: 'full'
  push-url:
    description: 'Endpoint for the privacy-stripped findings push (used when push-mode is "full"). Defaults to the SaaS endpoint at app.the-doctor.report.'
    required: false
    default: 'https://app.the-doctor.report/api/v1/findings'
  token:
    description: 'GitHub token used to post PR review comments and the sticky summary. Needs pull-requests: write. Defaults to the workflow token.'
    required: false
    default: ${{ github.token }}
  comment-mode:
    description: 'What to post on a PR when pr-comment is enabled: summary (sticky comment only) | review (inline comments only) | both.'
    required: false
    default: 'both'
  comment-on-clean:
    description: "When pr-comment is enabled, whether to create a summary comment when the scan finds no issues. Set to 'false' to only comment when there is something to fix. An existing summary comment is still updated."
    required: false
    default: 'true'

outputs:
  score:
    description: 'The integer quality score (0-100) reported by the doctor.'
    value: ${{ steps.summary.outputs.score }}
  findings-count:
    description: 'The total number of diagnostics reported by the doctor.'
    value: ${{ steps.summary.outputs.findings-count }}
  error-count:
    description: 'The number of error-severity diagnostics in the report.'
    value: ${{ steps.summary.outputs.error-count }}
  warning-count:
    description: 'The number of warn-severity diagnostics.'
    value: ${{ steps.summary.outputs.warning-count }}
  info-count:
    description: 'The number of info-severity diagnostics.'
    value: ${{ steps.summary.outputs.info-count }}
  affected-files:
    description: 'The number of distinct files with at least one diagnostic.'
    value: ${{ steps.summary.outputs.affected-files }}

runs:
  using: composite
  steps:
    - name: Validate framework input
      shell: bash
      env:
        INPUT_FRAMEWORK: ${{ inputs.framework }}
      run: |
        if [ "$INPUT_FRAMEWORK" != "vue" ] && [ "$INPUT_FRAMEWORK" != "nuxt" ]; then
          echo "::error::Invalid framework '$INPUT_FRAMEWORK'. Expected 'vue' or 'nuxt'."
          exit 2
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '26'

    # Pick the doctor to run: the project's own installed copy (default), the
    # range its package.json declares, an explicit `version`, or latest.
    # Registry picks are resolved to a concrete version for the cache key.
    - name: Resolve doctor version
      id: resolve
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_FRAMEWORK: ${{ inputs.framework }}
        INPUT_VERSION: ${{ inputs.version }}
      run: node "$GITHUB_ACTION_PATH/scripts/resolve-doctor.mjs" "$INPUT_FRAMEWORK" "$INPUT_VERSION"

    # Exact-version key, no restore-keys: a partial/older restore could carry a
    # mismatched native oxlint binding. Restore + explicit save (below) so a
    # failing gate, which fails the job by design, still saves the toolchain.
    - name: Restore doctor toolchain cache
      id: toolchain-cache
      if: steps.resolve.outputs.mode == 'registry'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/geoql-doctor-toolchain
        key: geoql-doctor-${{ inputs.framework }}-${{ steps.resolve.outputs.resolved }}-node26-${{ runner.os }}-${{ runner.arch }}

    - name: Install doctor
      if: steps.resolve.outputs.mode == 'registry'
      shell: bash
      env:
        INPUT_FRAMEWORK: ${{ inputs.framework }}
        RESOLVED: ${{ steps.resolve.outputs.resolved }}
        TOOLCHAIN_DIR: ${{ runner.temp }}/geoql-doctor-toolchain
      run: |
        # npm into a dedicated prefix, NOT `pnpm add -g`: pnpm's global add
        # caches dist-tags and trips a consumer repo's minimumReleaseAge policy.
        # Installing from inside the prefix keeps the consumer's .npmrc out of it.
        bin="$TOOLCHAIN_DIR/node_modules/.bin/${INPUT_FRAMEWORK}-doctor"
        if "$bin" --version >/dev/null 2>&1; then
          echo "Using cached @geoql/${INPUT_FRAMEWORK}-doctor@${RESOLVED}"
          exit 0
        fi
        rm -rf "$TOOLCHAIN_DIR"
        mkdir -p "$TOOLCHAIN_DIR"
        cd "$TOOLCHAIN_DIR" || exit 1
        npm install --prefix "$TOOLCHAIN_DIR" --no-save --no-audit --no-fund "@geoql/${INPUT_FRAMEWORK}-doctor@${RESOLVED}"
        # npm treats optional-dependency failures as non-fatal, so prove the bin
        # runs before it can be cached under the immutable version key.
        if ! "$bin" --version >/dev/null 2>&1; then
          rm -rf "$TOOLCHAIN_DIR"
          echo "::error::@geoql/${INPUT_FRAMEWORK}-doctor@${RESOLVED} installed but does not run."
          exit 1
        fi

    - name: Save doctor toolchain cache
      if: steps.resolve.outputs.mode == 'registry' && steps.toolchain-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/geoql-doctor-toolchain
        key: geoql-doctor-${{ inputs.framework }}-${{ steps.resolve.outputs.resolved }}-node26-${{ runner.os }}-${{ runner.arch }}

    # PR diff base: compare the PR head against its base, not the synthetic
    # merge ref against the merge base (which folds in base-branch drift).
    - name: Resolve PR diff base
      id: diff-base
      if: inputs.diff == 'true' && (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: node "$GITHUB_ACTION_PATH/scripts/diff-base.mjs" "$BASE_SHA" "$HEAD_SHA"

    - name: Run doctor
      id: doctor
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_FRAMEWORK: ${{ inputs.framework }}
        INPUT_PRESET: ${{ inputs.preset }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_DIFF: ${{ inputs.diff }}
        INPUT_PUSH_MODE: ${{ inputs.push-mode }}
        INPUT_PUSH_URL: ${{ inputs.push-url }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_PROJECT: ${{ inputs.project }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        DIFF_REF: ${{ steps.diff-base.outputs.ref }}
        RUN_MODE: ${{ steps.resolve.outputs.mode }}
        PACKAGE_MANAGER: ${{ steps.resolve.outputs.package-manager }}
        TOOLCHAIN_DIR: ${{ runner.temp }}/geoql-doctor-toolchain
      run: |
        bin="${INPUT_FRAMEWORK}-doctor"
        doctor() {
          if [ "$RUN_MODE" = "project" ]; then
            case "$PACKAGE_MANAGER" in
              pnpm) pnpm exec "$bin" "$@" ;;
              yarn) yarn run "$bin" "$@" ;;
              bun) bun run "$bin" "$@" ;;
              *) npm exec --no -- "$bin" "$@" ;;
            esac
          else
            "$TOOLCHAIN_DIR/node_modules/.bin/$bin" "$@"
          fi
        }

        args=(--preset "$INPUT_PRESET" --threshold "$INPUT_THRESHOLD" --fail-on "$INPUT_FAIL_ON")
        if [ "$INPUT_DIFF" = "true" ]; then
          if [ -n "$DIFF_REF" ]; then
            args+=(--changed-files-from "$DIFF_REF")
          else
            args+=(--diff)
          fi
        fi

        # v2 push mode: the CLI handles the privacy-stripped findings push
        # internally (rule IDs, severities, locations, message templates — never
        # source code or file contents). Only added when push-mode is "full" AND
        # an api-key is set; the legacy "score" mode keeps the curl-based step
        # below and the CLI does no network I/O.
        push_args=()
        if [ "$INPUT_PUSH_MODE" = "full" ] && [ -n "$INPUT_API_KEY" ]; then
          push_args+=(--push --push-url "$INPUT_PUSH_URL" --api-key "$INPUT_API_KEY" --push-project "$INPUT_PROJECT")
          # Monorepo: a non-root working-directory becomes the workspace tag so
          # multiple apps in one repo keep separate score series per project.
          if [ -n "$INPUT_WORKING_DIRECTORY" ] && [ "$INPUT_WORKING_DIRECTORY" != "." ]; then
            push_args+=(--push-workspace "$INPUT_WORKING_DIRECTORY")
          fi
        fi

        # Run the audit once to JSON (drives outputs + the gate exit code), then
        # emit SARIF from the same args for Code Scanning. set +e lets us capture
        # the gate exit code instead of letting `set -e` abort the step.
        set +e
        doctor "${args[@]}" "${push_args[@]}" --format json --output doctor-report.json
        code=$?
        # SARIF re-run must NOT carry the push args or every CI run double-posts
        # the same score/findings to the dashboard.
        doctor "${args[@]}" --format sarif --output doctor.sarif
        set -e

        echo "gate-code=$code" >> "$GITHUB_OUTPUT"

    # Outputs (score + counts) and the job step summary, every run.
    - name: Summarize
      id: summary
      if: always() && steps.doctor.outcome != 'skipped'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: node "$GITHUB_ACTION_PATH/scripts/report-summary.mjs" doctor-report.json

    - name: Push score to the-doctor.report
      if: inputs.api-key != '' && inputs.push-mode != 'full'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_PROJECT: ${{ inputs.project }}
        COMMIT_SHA: ${{ github.sha }}
        REF_NAME: ${{ github.ref_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        # Build the ingest body from the JSON report (.score.value +
        # .score.bySeverity.*) and post it with the x-api-key header. The push
        # runs even when the gate failed: a low score is exactly what the
        # dashboard needs to chart. jq --arg keeps everything string-safe.
        score=$(jq -r '.score.value' doctor-report.json)
        payload=$(jq -n \
          --arg project "$INPUT_PROJECT" \
          --argjson score "$score" \
          --argjson errorCount "$(jq '.score.bySeverity.error' doctor-report.json)" \
          --argjson warnCount "$(jq '.score.bySeverity.warn' doctor-report.json)" \
          --argjson infoCount "$(jq '.score.bySeverity.info' doctor-report.json)" \
          --arg commitSha "$COMMIT_SHA" \
          --arg branch "$REF_NAME" \
          --arg prNumber "$PR_NUMBER" \
          '{
            project: $project,
            score: $score,
            errorCount: $errorCount,
            warnCount: $warnCount,
            infoCount: $infoCount,
            commitSha: $commitSha,
            branch: $branch,
          }
          + (if $prNumber != "" then { prNumber: ($prNumber | tonumber) } else {} end)')

        status=$(curl -sS -o /tmp/doctor-push.json -w '%{http_code}' \
          -X POST 'https://app.the-doctor.report/api/v1/score' \
          -H 'content-type: application/json' \
          -H "x-api-key: $INPUT_API_KEY" \
          --data "$payload")

        if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
          echo "::notice::Pushed score $score to the-doctor.report (project: $INPUT_PROJECT)."
        else
          echo "::warning::Score push to the-doctor.report failed (HTTP $status): $(cat /tmp/doctor-push.json)"
        fi

    # PR review: post inline review comments on changed lines + a sticky
    # create-or-update summary comment. Gated to pull_request events and a
    # present token; degrades to a no-op otherwise (the script self-skips when
    # not a PR). The findings JSON is read from disk and parsed inside the
    # script — no PR title/body/head_ref is ever interpolated into a run: block
    # (script-injection safe). REPORT_PATH points at the report the audit step
    # already wrote, resolved against the working directory.
    - name: Post PR review + summary
      if: ${{ inputs.pr-comment == 'true' && github.event_name == 'pull_request' && inputs.token != '' }}
      uses: actions/github-script@v9
      env:
        REPORT_PATH: ${{ inputs.working-directory }}/doctor-report.json
        COMMENT_MODE: ${{ inputs.comment-mode }}
        COMMENT_ON_CLEAN: ${{ inputs.comment-on-clean }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        FRAMEWORK: ${{ inputs.framework }}
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const { readFileSync } = require('node:fs');
          const { pathToFileURL } = require('node:url');
          const path = require('node:path');

          const reportPath = process.env.REPORT_PATH;
          let report;
          try {
            report = JSON.parse(readFileSync(reportPath, 'utf8'));
          } catch (err) {
            core.warning(`No doctor report at ${reportPath} (${err.message}); skipping PR review.`);
            return;
          }

          const modUrl = pathToFileURL(
            path.join(process.env.ACTION_PATH, 'scripts', 'pr-review.mjs'),
          ).href;
          const { run } = await import(modUrl);

          await run({
            github,
            context,
            core,
            report,
            mode: process.env.COMMENT_MODE || 'both',
            workingDirectory: process.env.WORKING_DIRECTORY || '.',
            framework: process.env.FRAMEWORK,
            commentOnClean: process.env.COMMENT_ON_CLEAN !== 'false',
          });

    # Gate LAST so the score push + PR comment always run first, even on a
    # failing score. Re-applies the exit code captured in the audit step.
    - name: Enforce gate
      if: always()
      shell: bash
      env:
        GATE_CODE: ${{ steps.doctor.outputs.gate-code }}
      run: |
        if [ -n "$GATE_CODE" ] && [ "$GATE_CODE" -ne 0 ]; then
          echo "::error::doctor gate failed (exit $GATE_CODE): score below threshold or fail-on severity hit."
          exit "$GATE_CODE"
        fi
