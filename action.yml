name: 'Doctor — Vue / Nuxt Code Audit'
description: 'Audit Vue / Nuxt code with @geoql doctor — AI-slop, reactivity traps, and perf anti-patterns. Emits a quality score, structured findings, and a SARIF report for Code Scanning. v2 push mode streams privacy-stripped findings to the-doctor.report.'
author: 'geoql'

branding:
  icon: 'shield'
  color: 'green'

inputs:
  framework:
    description: 'Which doctor to run: vue | nuxt.'
    required: false
    default: 'vue'
  preset:
    description: 'Base rule preset: minimal | recommended | strict | all.'
    required: false
    default: 'recommended'
  threshold:
    description: 'Minimum passing score (0-100). The job fails when the score is below this value.'
    required: false
    default: '0'
  fail-on:
    description: 'Exit non-zero on this severity or worse: error | warn | none.'
    required: false
    default: 'error'
  diff:
    description: "Only report findings in files changed vs HEAD. Set to 'true' to enable."
    required: false
    default: 'false'
  pr-comment:
    description: "Emit a Markdown PR comment. Set to 'true' to enable."
    required: false
    default: 'false'
  working-directory:
    description: 'Directory to run the audit in (the project root).'
    required: false
    default: '.'
  api-key:
    description: 'the-doctor.report API key (doc_…). When set, the score and findings are pushed to your dashboard. Pass via secrets, never inline.'
    required: false
    default: ''
  project:
    description: 'Project slug for the-doctor.report dashboard. Defaults to the GitHub owner/repo.'
    required: false
    default: ${{ github.repository }}
  push-mode:
    description: 'How to push results to the-doctor.report: "full" (v2, CLI streams privacy-stripped findings in one call) or "score" (legacy, action posts only the score via curl).'
    required: false
    default: 'full'
  push-url:
    description: 'Endpoint for the privacy-stripped findings push (used when push-mode is "full"). Defaults to the SaaS endpoint at app.the-doctor.report.'
    required: false
    default: 'https://app.the-doctor.report/api/v1/findings'
  token:
    description: 'GitHub token used to post PR review comments and the sticky summary. Needs pull-requests: write. Defaults to the workflow token.'
    required: false
    default: ${{ github.token }}
  comment-mode:
    description: 'What to post on a PR when pr-comment is enabled: summary (sticky comment only) | review (inline comments only) | both.'
    required: false
    default: 'both'

outputs:
  score:
    description: 'The integer quality score (0-100) reported by the doctor.'
    value: ${{ steps.doctor.outputs.score }}
  findings-count:
    description: 'The total number of diagnostics reported by the doctor.'
    value: ${{ steps.doctor.outputs.findings-count }}

runs:
  using: composite
  steps:
    - name: Validate framework input
      shell: bash
      env:
        INPUT_FRAMEWORK: ${{ inputs.framework }}
      run: |
        if [ "$INPUT_FRAMEWORK" != "vue" ] && [ "$INPUT_FRAMEWORK" != "nuxt" ]; then
          echo "::error::Invalid framework '$INPUT_FRAMEWORK'. Expected 'vue' or 'nuxt'."
          exit 2
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Install doctor
      shell: bash
      env:
        INPUT_FRAMEWORK: ${{ inputs.framework }}
      run: |
        # Resolve the exact version from the registry HTTP API (no client-side
        # dist-tag cache) then install with `npm i -g`, NOT `pnpm add -g`. pnpm's
        # global-add path both caches the `latest` dist-tag (resolving stale
        # versions long after publish) and crashes on a consumer repo's
        # minimumReleaseAge policy (ERR_PNPM_RESOLUTION_POLICY_VIOLATIONS_UNHANDLED).
        # npm has neither problem and its global bin is already on PATH via setup-node.
        pkg="@geoql/${INPUT_FRAMEWORK}-doctor"
        version=$(curl -fsSL "https://registry.npmjs.org/${pkg}/latest" | jq -r '.version')
        if [ -z "$version" ] || [ "$version" = "null" ]; then
          echo "::error::Could not resolve latest version of ${pkg} from the npm registry."
          exit 1
        fi
        echo "Resolved ${pkg}@${version}"
        npm install -g "${pkg}@${version}"

    - name: Run doctor
      id: doctor
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_FRAMEWORK: ${{ inputs.framework }}
        INPUT_PRESET: ${{ inputs.preset }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_DIFF: ${{ inputs.diff }}
        INPUT_PUSH_MODE: ${{ inputs.push-mode }}
        INPUT_PUSH_URL: ${{ inputs.push-url }}
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_PROJECT: ${{ inputs.project }}
      run: |
        bin="${INPUT_FRAMEWORK}-doctor"
        args=(--preset "$INPUT_PRESET" --threshold "$INPUT_THRESHOLD" --fail-on "$INPUT_FAIL_ON")
        if [ "$INPUT_DIFF" = "true" ]; then
          args+=(--diff)
        fi

        # v2 push mode: the CLI handles the privacy-stripped findings push
        # internally (rule IDs, severities, locations, message templates — never
        # source code or file contents). Only added when push-mode is "full" AND
        # an api-key is set; the legacy "score" mode keeps the curl-based step
        # below and the CLI does no network I/O.
        if [ "$INPUT_PUSH_MODE" = "full" ] && [ -n "$INPUT_API_KEY" ]; then
          args+=(--push --push-url "$INPUT_PUSH_URL" --api-key "$INPUT_API_KEY" --push-project "$INPUT_PROJECT")
        fi

        # Run the audit once to JSON (drives outputs + the gate exit code), then
        # emit SARIF from the same args for Code Scanning. set +e lets us capture
        # the gate exit code instead of letting `set -e` abort the step.
        set +e
        "$bin" "${args[@]}" --format json --output doctor-report.json
        code=$?
        "$bin" "${args[@]}" --format sarif --output doctor.sarif
        set -e

        score=$(jq -r '.score.value' doctor-report.json)
        findings=$(jq -r '.diagnostics | length' doctor-report.json)

        {
          echo "score=$score"
          echo "findings-count=$findings"
          echo "gate-code=$code"
        } >> "$GITHUB_OUTPUT"

    - name: Push score to the-doctor.report
      if: inputs.api-key != '' && inputs.push-mode != 'full'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_API_KEY: ${{ inputs.api-key }}
        INPUT_PROJECT: ${{ inputs.project }}
        COMMIT_SHA: ${{ github.sha }}
        REF_NAME: ${{ github.ref_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        # Build the ingest body from the JSON report (.score.value +
        # .score.bySeverity.*) and post it with the x-api-key header. The push
        # runs even when the gate failed: a low score is exactly what the
        # dashboard needs to chart. jq --arg keeps everything string-safe.
        score=$(jq -r '.score.value' doctor-report.json)
        payload=$(jq -n \
          --arg project "$INPUT_PROJECT" \
          --argjson score "$score" \
          --argjson errorCount "$(jq '.score.bySeverity.error' doctor-report.json)" \
          --argjson warnCount "$(jq '.score.bySeverity.warn' doctor-report.json)" \
          --argjson infoCount "$(jq '.score.bySeverity.info' doctor-report.json)" \
          --arg commitSha "$COMMIT_SHA" \
          --arg branch "$REF_NAME" \
          --arg prNumber "$PR_NUMBER" \
          '{
            project: $project,
            score: $score,
            errorCount: $errorCount,
            warnCount: $warnCount,
            infoCount: $infoCount,
            commitSha: $commitSha,
            branch: $branch,
          }
          + (if $prNumber != "" then { prNumber: ($prNumber | tonumber) } else {} end)')

        status=$(curl -sS -o /tmp/doctor-push.json -w '%{http_code}' \
          -X POST 'https://app.the-doctor.report/api/v1/score' \
          -H 'content-type: application/json' \
          -H "x-api-key: $INPUT_API_KEY" \
          --data "$payload")

        if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
          echo "::notice::Pushed score $score to the-doctor.report (project: $INPUT_PROJECT)."
        else
          echo "::warning::Score push to the-doctor.report failed (HTTP $status): $(cat /tmp/doctor-push.json)"
        fi

    # PR review: post inline review comments on changed lines + a sticky
    # create-or-update summary comment. Gated to pull_request events and a
    # present token; degrades to a no-op otherwise (the script self-skips when
    # not a PR). The findings JSON is read from disk and parsed inside the
    # script — no PR title/body/head_ref is ever interpolated into a run: block
    # (script-injection safe). REPORT_PATH points at the report the audit step
    # already wrote, resolved against the working directory.
    - name: Post PR review + summary
      if: ${{ inputs.pr-comment == 'true' && github.event_name == 'pull_request' && inputs.token != '' }}
      uses: actions/github-script@v7
      env:
        REPORT_PATH: ${{ inputs.working-directory }}/doctor-report.json
        COMMENT_MODE: ${{ inputs.comment-mode }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const { readFileSync } = require('node:fs');
          const { pathToFileURL } = require('node:url');
          const path = require('node:path');

          const reportPath = process.env.REPORT_PATH;
          let report;
          try {
            report = JSON.parse(readFileSync(reportPath, 'utf8'));
          } catch (err) {
            core.warning(`No doctor report at ${reportPath} (${err.message}); skipping PR review.`);
            return;
          }

          const modUrl = pathToFileURL(
            path.join(process.env.ACTION_PATH, 'scripts', 'pr-review.mjs'),
          ).href;
          const { run } = await import(modUrl);

          await run({
            github,
            context,
            core,
            report,
            mode: process.env.COMMENT_MODE || 'both',
            workingDirectory: process.env.WORKING_DIRECTORY || '.',
          });

    # Gate LAST so the score push + PR comment always run first, even on a
    # failing score. Re-applies the exit code captured in the audit step.
    - name: Enforce gate
      if: always()
      shell: bash
      env:
        GATE_CODE: ${{ steps.doctor.outputs.gate-code }}
      run: |
        if [ -n "$GATE_CODE" ] && [ "$GATE_CODE" -ne 0 ]; then
          echo "::error::doctor gate failed (exit $GATE_CODE): score below threshold or fail-on severity hit."
          exit "$GATE_CODE"
        fi
